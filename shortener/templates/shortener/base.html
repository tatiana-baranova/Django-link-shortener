<!doctype html>
{% load static %}
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0,
    maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <title>{{ title }}</title>
</head>

<body>

<header class="container">
        <div class='logo-section'>
            <img class="logo-img" src="/media/logo.jpg" alt="ShortLink">
                <p class="text-info">Приберемо все зайве з посилання!</p>
        </div>
        <nav>
        <a href="{% url 'home' %}">Головна</a>
        <a href="{% url 'about' %}">Про нас</a>

        {% if user.is_authenticated %}
            <a href="{% url 'links' %}">Мої посилання</a>
            <a href="{% url 'profile' %}">Профіль</a>

            <form action="{% url 'exit' %}" method="post">
                {% csrf_token %}
                <button class="btn" type="submit">Вихід</button>
            </form>
        {% else %}
            <a href="{% url 'user' %}">Вхід</a>
            <a href="{% url 'reg' %}">Реєстрація</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block main %}
    {% endblock %}
</main>

<footer>
    <div class="footer-section container">
        <p>&copy; ShortLink — Всі права захищені</p>
    <ul class="social-links">
        <li>
            <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
        </li>

        <li>
            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </li>

        <li>
            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
        </li>

        <li>
            <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
        </li>
    </ul>
    </div>

    
</footer>

</body>
</html>
