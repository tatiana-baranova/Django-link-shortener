<!doctype html>
{% load static %}
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0,
          maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <title>{{ title }}</title>
</head>

<body>

<header class="container">
          <img class="logo-img" src="/media/logo.jpg" alt="ShortLink">
            <p class="text-info">Приберемо все зайве з посилання!</p>
        <nav>
        <a href="">Головна</a>
        <a href="">Про нас</a>

        {% if user.is_authenticated %}
            <a href="">Мої посилання</a>
            <a href="">Профіль</a>

            <form action="" method="post">
                {% csrf_token %}
                <button class="btn" type="submit">Вихід</button>
            </form>
        {% else %}
            <a href="">Вхід</a>
            <a href="{% url 'reg' %}">Реєстрація</a>
        {% endif %}
    </nav>



</header>

<main>
    {% block main %}
    {% endblock %}
</main>

<footer>
    &copy; ShortLink — Всі права захищені
</footer>

</body>
</html>
